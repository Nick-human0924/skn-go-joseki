name: Apply Supabase sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-supabase-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Supabase scripts and docs
        run: |
          node <<'NODE'
          const fs = require('fs');

          const scripts = [
            '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>',
            '<script src="supabase-config.js"></script>',
            '<script src="app.js?v=20260523-supabase-sync"></script>',
            '<script src="supabase-sync.js?v=20260524"></script>',
          ].join('\n    ');

          let index = fs.readFileSync('index.html', 'utf8');
          if (!index.includes('supabase-sync.js')) {
            index = index.replace(/<script src="app\.js\?v=[^"]+"><\/script>/, scripts);
            fs.writeFileSync('index.html', index);
          }

          let readme = fs.readFileSync('README.md', 'utf8');
          readme = readme.replace(
            '所有数据默认保存在当前浏览器的本地存储中，不需要账号登录，也不会上传到服务器。需要换设备时，可以用 JSON 导出和导入。',
            '所有数据默认保存在当前浏览器的本地存储中；登录后会把整份定式数据同步到 Supabase 账号。未登录时仍可离线使用，并保留 JSON 导入导出作为手动备份。'
          );
          if (!readme.includes('## Supabase 云同步')) {
            readme += `\n## Supabase 云同步\n\n当前已配置 Supabase 项目 \`ovsmowsqiivdxfptbqte\`。页面会加载 \`supabase-config.js\` 和 \`supabase-sync.js\`，右侧会显示账号同步入口。\n\n- 未登录：继续保存到当前浏览器的 \`localStorage\`。\n- 首次登录且云端无数据：上传当前本地数据作为账号初始数据。\n- 再次登录且云端有数据：拉取云端 store 覆盖本地并刷新页面。\n- 登录后编辑数据：本地保存后自动 debounce upsert 到 \`public.go_joseki_stores\`。\n\n数据库表和 RLS 策略见 \`supabase/go_joseki_stores.sql\`。前端只使用 Supabase publishable key，不包含 service role key。\n`;
            fs.writeFileSync('README.md', readme);
          }
          NODE
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git commit -m "Load Supabase sync scripts"
          git push
